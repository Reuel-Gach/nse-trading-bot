<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NSE Engine Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F3E5AB', dark: '#AA8C2C' },
                        dark: { 950: '#0a0a0a', 900: '#121212', 800: '#1c1c1c', 700: '#2a2a2a' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-950 text-gray-300 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-dark-900 border border-dark-700 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.9)] p-8 relative overflow-hidden">
        <!-- Top Terminal Accent Line -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-gold-dark via-gold to-gold-light"></div>
        
        <!-- Header -->
        <div class="text-center mb-6 pt-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-dark-800 border border-dark-700 text-[10px] font-mono text-gold mb-3 uppercase tracking-widest">
                <span class="w-2 h-2 rounded-full bg-gold animate-pulse"></span> New Account Initialization
            </div>
            <h1 class="text-2xl font-bold text-white tracking-widest uppercase">
                <span class="text-gold">NSE</span> Engine
            </h1>
            <p class="text-xs text-gray-500 mt-1 font-mono uppercase tracking-wider">Register Terminal Operator</p>
        </div>

        <!-- Feedback Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-5 p-3.5 rounded-xl bg-red-950/60 border border-red-500/50 text-red-200 text-xs font-mono flex items-center gap-2">
                    <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></path></svg>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-mono uppercase tracking-widest text-gray-400 mb-1.5">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                    class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition font-mono text-sm">
            </div>

            <div>
                <label for="email" class="block text-xs font-mono uppercase tracking-widest text-gray-400 mb-1.5">Email Address (for alerts)</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                    class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition font-mono text-sm">
            </div>

            <div>
                <label for="password" class="block text-xs font-mono uppercase tracking-widest text-gray-400 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password"
                    class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition font-mono text-sm">
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-mono uppercase tracking-widest text-gray-400 mb-1.5">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"
                    class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition font-mono text-sm">
            </div>

            <button type="submit" 
                class="w-full mt-3 bg-gold hover:bg-gold-light text-black font-bold py-3.5 rounded-xl transition uppercase tracking-widest text-xs shadow-[0_4px_20px_rgba(212,175,55,0.3)] font-mono">
                Initialize Account
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center mt-6 pt-5 border-t border-dark-800">
            <p class="text-xs text-gray-500">Already registered? <a href="{% url 'login' %}" class="text-gold hover:underline font-bold uppercase tracking-wider ml-1">Sign In</a></p>
        </div>
    </div>

</body>
</html>
