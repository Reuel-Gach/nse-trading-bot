<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NSE Engine{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#f3e5ab' },
                        dark: { 950: '#090a0f', 900: '#0f111a', 800: '#171a26', 700: '#252a3e' }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-slate-100 text-slate-900 transition-colors duration-200;
            }
            html.dark body {
                @apply bg-dark-950 text-slate-100;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- NAVIGATION BAR -->
    <nav class="bg-white dark:bg-dark-900 border-b border-slate-200 dark:border-dark-700 sticky top-0 z-40 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Brand & Logo -->
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                    <a href="{% url 'dashboard' %}" class="flex flex-col">
                        <span class="text-xs font-bold tracking-widest text-gold uppercase">NSE</span>
                        <span class="text-lg font-black tracking-wider text-slate-900 dark:text-white uppercase leading-none">ENGINE</span>
                    </a>
                </div>

                <!-- Desktop Navigation Links -->
                <div class="hidden md:flex items-center gap-6 font-mono text-xs uppercase tracking-wider">
                    <a href="{% url 'dashboard' %}" class="text-slate-700 dark:text-slate-200 hover:text-gold transition">Operations</a>
                    <a href="{% url 'market_radar' %}" class="text-slate-700 dark:text-slate-200 hover:text-gold transition">Radar</a>
                    <a href="{% url 'trade_journal' %}" class="text-slate-700 dark:text-slate-200 hover:text-gold transition">Journal</a>
                    <a href="{% url 'control_room' %}" class="text-slate-700 dark:text-slate-200 hover:text-gold transition">Control Room</a>
                </div>

                <!-- Right Side Actions & Theme Toggle -->
                <div class="hidden md:flex items-center gap-4">
                    <!-- Theme Toggle Button -->
                    <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-200 dark:bg-dark-800 text-slate-700 dark:text-gold hover:opacity-80 transition" title="Toggle Theme">
                        <span id="themeIcon">🌙</span>
                    </button>

                    <span class="font-mono text-xs text-slate-500 dark:text-slate-400 uppercase font-semibold">{{ user.username|default:"REUEL" }}</span>
                    <a href="{% url 'logout' %}" class="text-xs font-mono border border-red-500/50 text-red-600 dark:text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded transition uppercase tracking-wider font-bold">
                        Disconnect
                    </a>
                </div>

                <!-- Mobile Hamburger & Theme Toggle Button -->
                <div class="flex items-center gap-2 md:hidden">
                    <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-200 dark:bg-dark-800 text-slate-700 dark:text-gold">
                        <span id="mobileThemeIcon">🌙</span>
                    </button>
                    
                    <button onclick="toggleMobileMenu()" class="p-2 text-slate-700 dark:text-slate-200 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path id="menuBurger" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Drawer Menu -->
        <div id="mobileMenu" class="hidden md:hidden border-t border-slate-200 dark:border-dark-700 bg-white dark:bg-dark-900 px-4 pt-3 pb-5 space-y-3 font-mono text-sm uppercase tracking-wider">
            <a href="{% url 'dashboard' %}" class="block py-2 text-slate-800 dark:text-slate-200 hover:text-gold font-bold">Operations Dashboard</a>
            <a href="{% url 'market_radar' %}" class="block py-2 text-slate-800 dark:text-slate-200 hover:text-gold font-bold">Market Radar</a>
            <a href="{% url 'trade_journal' %}" class="block py-2 text-slate-800 dark:text-slate-200 hover:text-gold font-bold">Trade Journal</a>
            <a href="{% url 'control_room' %}" class="block py-2 text-slate-800 dark:text-slate-200 hover:text-gold font-bold">Control Room</a>
            <div class="pt-3 border-t border-slate-200 dark:border-dark-700 flex justify-between items-center">
                <span class="text-xs text-slate-500 dark:text-slate-400">User: {{ user.username|default:"REUEL" }}</span>
                <a href="{% url 'logout' %}" class="text-xs text-red-500 font-bold border border-red-500/50 px-3 py-1 rounded">Disconnect</a>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Theme & Menu Toggle Scripts -->
    <script>
        // Check stored theme or default to Dark
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            updateIcons(false);
        } else {
            document.documentElement.classList.add('dark');
            updateIcons(true);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcons(isDark);
        }

        function updateIcons(isDark) {
            const icon = isDark ? '🌙' : '☀️';
            const desktopIcon = document.getElementById('themeIcon');
            const mobileIcon = document.getElementById('mobileThemeIcon');
            if (desktopIcon) desktopIcon.innerText = icon;
            if (mobileIcon) mobileIcon.innerText = icon;
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
