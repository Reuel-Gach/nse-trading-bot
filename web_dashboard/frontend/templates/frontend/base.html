<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NSE Engine - Terminal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F3E5AB', dark: '#AA8C2C' },
                        dark: { 950: '#0a0a0a', 900: '#121212', 800: '#1c1c1c', 700: '#2a2a2a' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-900 text-gray-300 font-sans min-h-screen flex flex-col">

    <!-- Global Navigation Framework -->
    <nav class="bg-dark-800 border-b border-gold/30 px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
        <!-- Brand & Status -->
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                <h1 class="text-xl font-bold text-white tracking-widest uppercase">
                    <span class="text-gold">NSE</span> Engine
                </h1>
            </div>
            
<!-- Module Links inside base.html -->
<div class="hidden md:flex space-x-1 border-l border-dark-700 pl-6">
    <a href="{% url 'dashboard' %}" class="px-3 py-1.5 rounded text-xs font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'dashboard' %}bg-dark-700 text-gold{% else %}text-gray-400 hover:text-white hover:bg-dark-700/50{% endif %} transition">
        Dashboard
    </a>
    <a href="#" class="px-3 py-1.5 rounded text-xs font-bold uppercase tracking-wider text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
        Market Radar
    </a>
    <a href="{% url 'trade_journal' %}" class="px-3 py-1.5 rounded text-xs font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'trade_journal' %}bg-dark-700 text-gold{% else %}text-gray-400 hover:text-white hover:bg-dark-700/50{% endif %} transition">
        Trade Journal
    </a>
    <a href="#" class="px-3 py-1.5 rounded text-xs font-bold uppercase tracking-wider text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
        Control Room
    </a>
</div>
        </div>

        <!-- User Actions -->
        <div class="flex items-center space-x-4">
            <span class="text-xs text-gray-400 uppercase tracking-widest font-mono">{{ user.username|default:"Operator" }}</span>
            <a href="{% url 'logout' %}" class="text-xs border border-dark-700 text-gray-400 px-3 py-1.5 rounded hover:border-red-500 hover:text-red-500 transition uppercase tracking-wider font-bold">
                Disconnect
            </a>
        </div>
    </nav>

    <!-- Main Dynamic Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        {% block content %}
        <!-- Child templates will inject their content here -->
        {% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
