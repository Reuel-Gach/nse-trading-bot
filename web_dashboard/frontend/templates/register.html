<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NSE Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F3E5AB', dark: '#AA8C2C' },
                        dark: { 900: '#050505', 800: '#121212', 700: '#1F1F1F' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-gray-300 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-dark-800 border border-dark-700 rounded-xl shadow-2xl p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-gold-dark via-gold to-gold-light"></div>
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-wider uppercase">
                <span class="text-gold">NSE</span> Terminal
            </h1>
            <p class="text-xs text-gray-500 mt-1">Register new operator account</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded bg-red-900/40 border border-red-500/50 text-red-200 text-xs">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full bg-dark-900 border border-dark-700 rounded px-4 py-2.5 text-white focus:outline-none focus:border-gold transition">
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full bg-dark-900 border border-dark-700 rounded px-4 py-2.5 text-white focus:outline-none focus:border-gold transition">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full bg-dark-900 border border-dark-700 rounded px-4 py-2.5 text-white focus:outline-none focus:border-gold transition">
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full bg-dark-900 border border-dark-700 rounded px-4 py-2.5 text-white focus:outline-none focus:border-gold transition">
            </div>

            <button type="submit" 
                class="w-full mt-2 bg-gold hover:bg-gold-light text-black font-bold py-3 rounded transition uppercase tracking-wider text-sm shadow-lg">
                Create Account
            </button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">
            Already registered? <a href="{% url 'login' %}" class="text-gold hover:underline">Sign In</a>
        </p>
    </div>

</body>
</html>
